[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "evidence-rag"
dynamic = ["version"]
description = "Evidence-first retrieval foundations for technical documents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Om Patel" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.119,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",
    "python-multipart>=0.0.20,<0.1",
    "uvicorn>=0.38,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.18.2,<2",
    "pytest>=8.4.2,<9",
    "reportlab>=4.4,<5",
    "ruff>=0.14.2,<0.15",
    "types-reportlab>=4.4,<5",
]

[tool.hatch.version]
path = "src/evidence_rag/__init__.py"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
