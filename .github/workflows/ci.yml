name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lockfile
        run: uv lock --check

      - name: Install project and development dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src tests

      - name: Test
        run: uv run pytest

      - name: Verify deterministic PDF fixtures
        run: uv run python scripts/generate_fixtures.py --check

      - name: Validate committed evaluation data
        run: >-
          uv run python -m evidence_rag.eval.validate
          --manifest datasets/manifests/fixtures.json
          datasets/eval/fixture_items.jsonl

  ingestion-e2e:
    name: Ingestion end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked project and development dependencies
        run: uv sync --all-extras --dev

      - name: Run bounded owned-fixture ingestion lifecycle
        run: uv run pytest tests/test_lifecycle.py -q

  container:
    name: Container
    needs: [quality, ingestion-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build commit-traceable candidate image
        run: >-
          docker build
          --build-arg VCS_REF=${{ github.sha }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          --tag evidencerag:pr
          .

      - name: Verify container health and runtime user
        shell: bash
        run: |
          docker run --detach --name evidencerag-ci evidencerag:pr
          cleanup() {
            docker logs evidencerag-ci || true
            docker rm --force evidencerag-ci || true
          }
          trap cleanup EXIT
          for attempt in {1..15}; do
            state="$(docker inspect --format '{{.State.Health.Status}}' evidencerag-ci)"
            if [[ "$state" == "healthy" ]]; then
              break
            fi
            sleep 2
          done
          test "${state:-missing}" = "healthy"
          test "$(docker exec evidencerag-ci id -u)" = "10001"
