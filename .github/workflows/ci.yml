name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project and development dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run complete quality gate
        shell: bash
        run: |
          mkdir -p reports/generated
          uv run --locked python scripts/quality_gate.py 2>&1 | tee reports/generated/quality.log

      - name: Save verification logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-python-${{ matrix.python-version }}
          path: reports/generated/quality.log
          if-no-files-found: warn
          retention-days: 14

  ingestion-e2e:
    name: Ingestion end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked project and development dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run bounded owned-fixture ingestion lifecycle
        run: uv run pytest tests/test_lifecycle.py -q

      - name: Verify live answer schema and cited PDF flow with a fake transport
        run: uv run --locked pytest tests/test_openai_answers.py -q

  qdrant-integration:
    name: Qdrant integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0-unprivileged
        ports:
          - 6333:6333
    env:
      QDRANT_URL: http://127.0.0.1:6333

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies without downloading a model
        run: uv sync --locked --all-extras --dev

      - name: Wait for Qdrant health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent "$QDRANT_URL/healthz"; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Test scoped dense index lifecycle against Qdrant
        run: uv run pytest tests/test_qdrant_integration.py -q

  container:
    name: Container
    needs: [quality, ingestion-e2e, qdrant-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Install uv and Python for the HTTP smoke test
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked smoke test dependencies
        run: uv sync --locked --dev

      - name: Build commit-traceable candidate image
        run: docker build --build-arg "VCS_REF=$GITHUB_SHA" --tag evidencerag:ci .

      - name: Verify Compose runtime and cited-answer demo
        shell: bash
        env:
          COMPOSE_PROJECT_NAME: evidencerag-ci
          IMAGE_TAG: ci
          EVIDENCERAG_DEMO_ANSWERS: "true"
        run: |
          cleanup() {
            docker compose logs --no-color || true
            docker compose down --volumes || true
          }
          trap cleanup EXIT
          docker compose up --no-build --wait --wait-timeout 45
          test "$(docker compose exec -T api id -u)" = "10001"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' evidencerag:ci)" = "$GITHUB_SHA"
          uv run --locked python scripts/measure_local.py --base-url http://127.0.0.1:8000 \
            --output build/verification/container-demo.json

      - name: Record build provenance and runtime package inventory
        shell: bash
        run: |
          mkdir -p build/verification
          docker image inspect --format '{{.Id}} {{.Os}}/{{.Architecture}} {{json .Config.Labels}}' \
            evidencerag:ci > build/verification/image.txt
          sha256sum uv.lock Dockerfile pyproject.toml compose.yaml scripts/measure_local.py \
            > build/verification/inputs.sha256
          docker run --rm evidencerag:ci python -c 'from importlib.metadata import distributions; print("\n".join(sorted("{}=={}".format(d.metadata["Name"], d.version) for d in distributions())))' \
            > build/verification/runtime-packages.txt

      - name: Save artifact verification record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-verification-${{ github.sha }}
          path: build/verification/
          if-no-files-found: error
          retention-days: 14
